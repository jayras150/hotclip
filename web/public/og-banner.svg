<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HookClip — Turn long videos into viral shorts">
  <defs>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="og-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF6"/>
      <stop offset="0.55" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#06080D"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <circle cx="980" cy="130" r="380" fill="url(#og-glow)"/>
  <circle cx="180" cy="560" r="320" fill="url(#og-glow-2)"/>

  <!-- brand row -->
  <g transform="translate(96 96) scale(2.4)">
    <rect x="8" y="2" width="16" height="28" rx="4" fill="none" stroke="url(#og-mark)" stroke-width="2.4"/>
    <path d="M12.6 16.2 L12.6 25 L21.4 20.6 Z" fill="url(#og-mark)"/>
    <rect x="4.6" y="9" width="1.6" height="14" rx="0.8" fill="url(#og-mark)" opacity="0.85"/>
  </g>

  <text x="200" y="190" fill="#E6EDF6" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">
    HookClip
  </text>

  <text x="96" y="352" fill="url(#og-title)" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.6">
    Turn long videos
  </text>
  <text x="96" y="442" fill="url(#og-title)" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.6">
    into viral shorts
  </text>

  <text x="96" y="512" fill="#8A97AB" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" letter-spacing="1">
    AI clip studio · hookclip.pro
  </text>

  <rect x="96" y="548" width="220" height="2" fill="url(#og-mark)" opacity="0.9"/>

  <!-- right: stacked 9:16 previews -->
  <g transform="translate(860 300)">
    <rect x="0" y="0" width="112" height="200" rx="16" fill="#0C1018" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="140" y="-30" width="112" height="260" rx="16" fill="#0C1018" stroke="url(#og-mark)" stroke-width="3"/>
    <path d="M176 70 L176 130 L216 100 Z" fill="url(#og-mark)"/>
    <rect x="280" y="10" width="90" height="180" rx="16" fill="#0C1018" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="2"/>
  </g>
</svg>

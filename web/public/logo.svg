<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HookClip">
  <defs>
    <linearGradient id="hc-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="hc-fill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <clipPath id="hc-clip">
      <rect x="8" y="2" width="16" height="28" rx="4"/>
    </clipPath>
  </defs>

  <!-- 9:16 vertical frame -->
  <rect x="8" y="2" width="16" height="28" rx="4" fill="none" stroke="url(#hc-stroke)" stroke-width="2.4"/>

  <g clip-path="url(#hc-clip)">
    <!-- clapper hinge bars -->
    <path d="M6 6.6 L26 9.2" stroke="url(#hc-stroke)" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <path d="M6 10.4 L26 13" stroke="url(#hc-stroke)" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <!-- play head -->
    <path d="M12.6 16.2 L12.6 25 L21.4 20.6 Z" fill="url(#hc-fill)"/>
  </g>
  <!-- accent spine -->
  <rect x="4.6" y="9" width="1.6" height="14" rx="0.8" fill="url(#hc-fill)" opacity="0.85"/>
</svg>

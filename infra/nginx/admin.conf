# HotClip admin vhost — admin.hookclip.pro
#
# Rendered/static counterpart of the server block in bootstrap.sh (which is
# templated for the main domain). This file is mounted read-only at
# /etc/nginx/conf.d/admin.conf and serves the admin dashboard:
#   - /api/ and /logs/ go to the API container (same as the main domain)
#   - everything else goes to the web container (Next.js /admin routes)
#
# NOTE: certificate paths are placeholders until certbot issues the cert for
# ADMIN_DOMAIN. While the certificate is missing nginx -t will fail for this
# vhost; bootstrap.sh keeps the previous valid config in that case, so remove
# this file (or comment it out) until the admin certificate exists.

# --- shared upstreams (defined in default.conf; kept independent so this file
# --- also works when default.conf changes) ----------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
upstream hotclip_admin_api { zone hotclip_admin_api 64k; server api:8080 resolve; }
upstream hotclip_admin_web { zone hotclip_admin_web 64k; server web:3000 resolve; }

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name admin.hookclip.pro;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS -----------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.hookclip.pro;

  ssl_certificate     /etc/letsencrypt/live/admin.hookclip.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.hookclip.pro/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  location /api/ {
    proxy_pass http://hotclip_admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /logs/ {
    proxy_pass http://hotclip_admin_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://hotclip_admin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
